# apkg-pack on the computers authors build on. Host checks only: nothing
# here runs on AROS, and nothing reaches the catalogue.
name: apkg-pack
on:
  push:
    paths: ["tools/apkg-pack", "tools/mkindex.py", "tools/catalogue.py", "tools/publish_github.py",
            "tools/make-apkg-pack.py", "tools/ci_check_index.py", "tests/test_ci_check.py",
            "tests/test_apkg_pack*.py", "tests/test_publish_github.py",
            ".github/workflows/apkg-pack.yml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_apkg_pack_standalone.py
      - run: python tests/test_ci_check.py
      - run: python tests/test_apkg_pack.py
      # The stand-in gh is a POSIX script; submit --pr is not tested on Windows.
      - run: python tests/test_publish_github.py
        if: runner.os != 'Windows'
      - run: python tools/make-apkg-pack.py --output dist/apkg-pack.pyz
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: apkg-pack.pyz
          path: dist/apkg-pack.pyz
